services: 
  # LAYER 1: The Gateway (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: ide-gateway
    ports:
      - "80:80"
    volumes:
      # Compiles the template with .env variables
      - ./infra/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      # Mounts the static compiled frontend files directly from host dist
      - ./frontend/dist:/usr/share/nginx/html:ro
    environment:
      - HTTP_PORT=80
      - DOMAIN_NAME=${DOMAIN_NAME}
      - BACKEND_PORT=${BACKEND_PORT}
      - DOCKER_RESOLVER=${DOCKER_RESOLVER}
      - CLIENT_MAX_BODY_SIZE=${CLIENT_MAX_BODY_SIZE}
      - WORKER_CONNECTIONS=${WORKER_CONNECTIONS}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    networks:
      - bridge_net
    depends_on:
      - backend
    restart: always

  # LAYER 2: The Logic (Node.js Manager)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend  
    user: root # Required to interface with docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VOLUME_BASE_PATH}:${VOLUME_BASE_PATH}
    environment:
      - NODE_ENV=production
      - PORT=${BACKEND_PORT}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - VOLUME_BASE_PATH=${VOLUME_BASE_PATH}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    networks:
      - bridge_net
    restart: always

networks:
  bridge_net:
    name: bridge_net
    driver: bridge