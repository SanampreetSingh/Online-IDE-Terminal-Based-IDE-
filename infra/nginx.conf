# infra/nginx.conf

worker_processes auto;

events {
    worker_connections ${WORKER_CONNECTIONS};
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

    # Uses DOCKER_RESOLVER from your .env (Crucial for dynamic proxy_pass)
    resolver ${DOCKER_RESOLVER} valid=30s;

    upstream backend_server {
        server backend:${BACKEND_PORT};
    }

    server {
        listen ${HTTP_PORT};
        server_name ${DOMAIN_NAME};

        # 1. FRONTEND
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. BACKEND API
        location /api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. WEBSOCKET (Terminal)
        location /socket.io/ {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Keep terminal alive
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # --- DYNAMIC PREVIEWS (Zero-Config Strategy) ---

        # A. Preview Assets & Vite Internals (Scripts, CSS, HMR WebSockets)
        # Matches anything AFTER the user_id that has a path (e.g. /src/main.jsx, /@vite/client)
        location ~ ^/preview/(?<user_id>[^/]+)/(?<app_path>.+)$ {
            auth_request /auth-verify;
            
            set $target_port $arg_port;
            if ($target_port = "") { 
                set $target_port 3000;
            }

            proxy_pass http://ide-user-$user_id:$target_port/$app_path$is_args$args;
            
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_buffering off;
            
            # CRITICAL FIX: Removed proxy_hide_header Content-Type.
            # Vite's application/javascript header MUST pass through to the browser.
        }

        # B. Preview Root (HTML Requests)
        # Matches exactly /preview/<user_id> or /preview/<user_id>/ to serve the index.html
        location ~ ^/preview/(?<user_id>[^/]+)/?$ {
            auth_request /auth-verify;
            
            set $target_port $arg_port;
            if ($target_port = "") { 
                set $target_port 3000;
            }

            proxy_pass http://ide-user-$user_id:$target_port/$is_args$args;
            
            # CRITICAL FIX: Prevent the container from gzipping the response 
            # so that sub_filter can actually read and modify the HTML text.
            proxy_set_header Accept-Encoding ""; 
            
            # Inject base tag so user scripts resolve to this preview path
            sub_filter '<head>' '<head><base href="/preview/$user_id/">';
            sub_filter_once on;

            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_buffering off;
        }

        # 4. Auth Sub-request (Internal)
        location = /auth-verify {
            internal;
            proxy_pass http://backend_server/api/auth/verify-preview;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Target-User $user_id;
            proxy_set_header Cookie $http_cookie;
        }
    }
}