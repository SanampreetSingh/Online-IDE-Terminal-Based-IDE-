# infra/nginx.conf

worker_processes auto;

events {
    worker_connections ${WORKER_CONNECTIONS};
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

    # Uses DOCKER_RESOLVER from .env
    resolver ${DOCKER_RESOLVER} valid=10s;

    upstream backend_server {
        server backend:${BACKEND_PORT};
    }

    server {
        listen ${HTTP_PORT};
        server_name ${DOMAIN_NAME};

        # 1. FRONTEND UI & VITE HMR WEBSOCKET UPGRADES
        location / {
            root /usr/share/nginx/html;
            index index.html;

            # Catch root Vite HMR WebSocket requests from active preview sessions
            if ($http_upgrade = "websocket") {
                rewrite ^ /_vite_ws break;
            }

            try_files $uri $uri/ /index.html;
        }

        # Dedicated HMR WebSocket Upstream Handler with HTTP/1.1 Upgrade headers
        location = /_vite_ws {
            internal;
            set $user_id $cookie_preview_user;
            set $target_port $cookie_preview_port;
            if ($target_port = "") { set $target_port 5173; }

            proxy_pass http://ide-user-$user_id:$target_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # 2. BACKEND API
        location /api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. WEBSOCKET (Terminal)
        location /socket.io/ {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # --- DYNAMIC PREVIEWS (Zero-Config Strategy) ---
        location ~ ^/preview/(?<user_id>[^/]+)(?<app_path>/.*)?$ {
            auth_request /auth-verify;

            # 1. Port Resolution Strategy: Query Param (?port=5173) -> Cookie -> Default 3000
            set $target_port $arg_port;
            if ($target_port = "") {
                set $target_port $cookie_preview_port;
            }
            if ($target_port = "") { 
                set $target_port 3000;
            }

            # 2. Path Resolution
            set $real_path $app_path;
            if ($real_path = "") {
                set $real_path "/";
            }

            proxy_pass http://ide-user-$user_id:$target_port$real_path$is_args$args;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            error_page 502 504 = /preview_502.html;

            # 3. Save user_id and target_port in Cookies on Path=/
            add_header Set-Cookie "preview_user=$user_id; Path=/; SameSite=Lax";
            if ($arg_port != "") {
                add_header Set-Cookie "preview_port=$arg_port; Path=/; SameSite=Lax";
            }

            # 4. Disable backend compression for sub_filter compatibility
            proxy_set_header Accept-Encoding "";

            # 5. Rewrite root-relative script/link/import tags in HTML
            sub_filter 'src="/' 'src="/preview/$user_id/';
            sub_filter 'href="/' 'href="/preview/$user_id/';
            sub_filter 'from "/' 'from "/preview/$user_id/';
            sub_filter 'import "/' 'import "/preview/$user_id/';
            sub_filter 'from \'/' 'from \'/preview/$user_id/';
            sub_filter 'import \'/' 'import \'/preview/$user_id/';
            sub_filter '<head>' '<head><base href="/preview/$user_id/">';
            sub_filter_types text/html;
            sub_filter_once off;

            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }

        # 4. FALLBACK ROUTER FOR DEV SERVER ROOT-RELATIVE IMPORTS & STATIC ASSETS
        location ~ ^/(src|node_modules|@vite|@fs|@id|assets|public|favicon|.*\.svg|.*\.png|.*\.ico|.*\.js|.*\.css|.*\.mjs|.*\.ts)/ {
            set $user_id $cookie_preview_user;
            set $target_port $cookie_preview_port;
            if ($target_port = "") {
                set $target_port 3000;
            }

            if ($user_id != "") {
                proxy_pass http://ide-user-$user_id:$target_port$request_uri;
            }

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }

        # Custom 502/504 Preview Error Banner
        location = /preview_502.html {
            internal;
            default_type text/html;
            return 502 '
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <title>Preview Server Not Detected</title>
              <style>
                body { background: #020617; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; display: flex; height: 100vh; align-items: center; justify-content: center; margin: 0; }
                .card { background: #0f172a; border: 1px solid #1e293b; padding: 2.5rem; border-radius: 1.5rem; max-width: 500px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
                h1 { color: #38bdf8; font-size: 1.5rem; margin-top: 0; font-weight: 700; }
                p { color: #94a3b8; font-size: 0.875rem; line-height: 1.6; }
                code { background: #1e293b; color: #38bdf8; padding: 0.3rem 0.6rem; border-radius: 0.5rem; font-family: monospace; font-size: 0.85rem; border: 1px solid #334155; }
              </style>
            </head>
            <body>
              <div class="card">
                <h1>⚡ Preview App Offline</h1>
                <p>No active web server was detected on port <b>5173/3000</b> inside your workspace container.</p>
                <p>Make sure your dev server is running inside the container:</p>
                <p><code>npm run dev -- --host 0.0.0.0</code></p>
                <p style="margin-top: 1.5rem;">Or run the helper CLI in your terminal:<br/><code>serve-link 5173</code></p>
              </div>
            </body>
            </html>';
        }

        # 5. Auth Sub-request (Internal)
        location = /auth-verify {
            internal;
            proxy_pass http://backend_server/api/auth/verify-preview;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Target-User $user_id;
            proxy_set_header Cookie $http_cookie;
        }
    }
}